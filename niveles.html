<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TampiDoku - Niveles</title>
<style>
:root{
    --bg:#f4f4f9;--panel:#fff;--text:#43506c;--dark:#2d3748;--muted:#7b879d;
    --blue:#63b3ed;--green:#9ae6b4;--purple:#b794f4;--yellow:#ffd166;
    --shadow:0 10px 28px rgba(53,91,140,.10);--soft:0 5px 14px rgba(40,60,90,.07)
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
body{background:var(--bg);color:var(--text);user-select:none}
button,input{font:inherit}
.app{width:min(100%,560px);margin:auto;min-height:100vh;padding:18px 16px 40px}
.levels-sticky{
    position:sticky;
    top:0;
    z-index:30;
    margin:0 -8px 8px;
    padding:8px 8px 6px;
    background:rgba(244,244,249,.90);
    backdrop-filter:blur(10px);
    border-radius:0 0 22px 22px;
}
.levels-sticky .progress-card{margin-bottom:10px}
.levels-sticky .chapter-card{margin-bottom:0}

.topbar{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:10px;margin-bottom:14px}
.icon-btn{width:44px;height:44px;border:0;border-radius:16px;background:#fff;color:var(--text);box-shadow:var(--soft);cursor:pointer;font-size:22px}
.brand{text-align:center}.brand h1{margin:0;color:#333;font-size:1.55rem;line-height:1.1}.brand small{display:block;margin-top:4px;color:var(--muted);font-weight:600;font-size:.8rem}
.progress-card{background:rgba(255,255,255,.86);border-radius:24px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:18px}
.progress-head,.progress-meta,.chapter-card{display:flex;justify-content:space-between;align-items:center;gap:12px}
.progress-title{font-weight:800;color:var(--dark)}.progress-info{font-size:.85rem;font-weight:700;color:var(--muted)}
.progress-track{height:10px;border-radius:999px;background:#e8edf4;overflow:hidden;margin-top:10px}
.progress-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,#9ae6b4,#63b3ed);width:0}
.progress-meta{margin-top:8px;font-size:.78rem;color:var(--muted);font-weight:600}
.chapter-card{background:#eaf2fa;color:#2c5282;border-radius:16px;padding:10px 12px;margin-bottom:10px}
.chapter-card strong{font-size:.9rem}.chapter-card span{font-size:.76rem;opacity:.78}
.chapter-nav{display:flex;gap:6px}.chapter-nav button{border:0;background:#fff;color:#2c5282;border-radius:10px;width:30px;height:30px;cursor:pointer;font-weight:800}
.chapter-nav button:disabled{opacity:.35;cursor:default}
.level-map{position:relative;padding:10px 0 18px}
.route-svg{position:absolute;inset:10px 0 0;width:100%;height:calc(100% - 10px);pointer-events:none;z-index:0;overflow:visible}
.route-path{fill:none;stroke:#d9e3ee;stroke-width:7;stroke-linecap:round;stroke-dasharray:2 15}
.level-row{min-height:102px;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;position:relative;z-index:1}
.level-row.left .level-wrap{grid-column:1}.level-row.center .level-wrap{grid-column:2}.level-row.right .level-wrap{grid-column:3}
.level-wrap{justify-self:center;text-align:center;min-width:88px}
.stars{height:20px;margin-bottom:2px;letter-spacing:1px;font-size:16px;white-space:nowrap}.stars .off{opacity:.16;filter:grayscale(1)}
.level-node{width:68px;height:68px;border:0;border-radius:22px;display:flex;align-items:center;justify-content:center;margin:auto;font-size:20px;font-weight:800;color:var(--text);cursor:pointer;box-shadow:var(--soft);transition:.14s;position:relative}
.level-node:hover:not(:disabled){transform:translateY(-2px)}.level-node:active:not(:disabled){transform:scale(.95)}
.level-node.completed{background:#fff}.level-node.available{background:#eef7ff;color:#2c5282;outline:2px solid rgba(99,179,237,.30)}
.level-node.current{background:linear-gradient(145deg,#79c7ff,#63b3ed);color:#fff;box-shadow:0 0 0 7px rgba(99,179,237,.15),0 9px 22px rgba(53,91,140,.20);animation:pulse 1.8s ease-in-out infinite}
.level-node.locked{background:#eceff4;color:#9ca8ba;cursor:not-allowed;box-shadow:none}
.lock{position:absolute;right:-5px;bottom:-5px;width:25px;height:25px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;box-shadow:var(--soft)}
.level-label{margin-top:7px;font-size:.72rem;color:var(--muted);font-weight:700}
@keyframes pulse{50%{box-shadow:0 0 0 11px rgba(99,179,237,.05),0 11px 28px rgba(53,91,140,.24)}}
.quick-jump{position:sticky;bottom:14px;z-index:20;display:flex;justify-content:center;margin-top:6px}
.jump-btn{border:0;background:#fff;color:var(--text);border-radius:22px;padding:10px 18px;font-weight:800;box-shadow:0 9px 28px rgba(53,91,140,.18);cursor:pointer}
.backdrop{position:fixed;inset:0;background:rgba(20,28,38,.34);display:none;align-items:flex-end;justify-content:center;z-index:100;padding:16px}
.backdrop.open{display:flex}.dialog{width:min(460px,100%);background:#f4f7fb;border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.22);padding:16px}
.dialog-head{display:flex;justify-content:space-between;align-items:center}.dialog-head h2{font-size:1.05rem;margin:0;color:var(--dark)}
.close-btn{border:0;background:transparent;font-size:24px;color:var(--text);cursor:pointer}
.jump-form{display:flex;gap:8px;margin:14px 0 8px}.jump-form input{flex:1;min-width:0;border:1px solid #dce4ee;background:#fff;border-radius:14px;padding:11px 12px;color:var(--dark);outline:none}
.jump-form button{border:0;border-radius:14px;padding:0 16px;background:#63b3ed;color:#fff;font-weight:800;cursor:pointer}
.dialog-note{text-align:center;color:var(--muted);font-size:.8rem;min-height:20px}
@media(max-width:420px){.app{padding-left:12px;padding-right:12px}.level-row{min-height:94px}.level-node{width:62px;height:62px;border-radius:20px;font-size:18px}}
</style>
</head>
<body>
<main class="app">
    <header class="topbar">
        <button class="icon-btn" type="button" aria-label="Ir al inicio" id="go-home">⌂</button>
        <div class="brand"><h1>TampiDoku</h1><small>Selecciona un nivel</small></div>
        <button class="icon-btn" type="button" aria-label="Continuar nivel actual" id="go-current">▶</button>
    </header>

    <div class="levels-sticky">
    <section class="progress-card">
        <div class="progress-head">
            <div class="progress-title">Tu progreso</div>
            <div id="progress-info" class="progress-info">Cargando...</div>
        </div>
        <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
        <div class="progress-meta">
            <span id="completed-info">--</span>
            <span id="stars-info">--</span>
        </div>
    </section>

    <section class="chapter-card">
        <div>
            <strong id="chapter-title">Niveles</strong>
            <span id="chapter-range"></span>
        </div>
        <div class="chapter-nav">
            <button id="prev-page" type="button" aria-label="Bloque anterior">‹</button>
            <button id="next-page" type="button" aria-label="Bloque siguiente">›</button>
        </div>
    </section>

    </div>

    <section id="level-map" class="level-map">
        <svg class="route-svg" aria-hidden="true"></svg>
        <div id="levels"></div>
    </section>

    <div class="quick-jump">
        <button id="open-jump" class="jump-btn" type="button">▦ Ir a un nivel</button>
    </div>
</main>

<div id="selector" class="backdrop" aria-hidden="true">
    <section class="dialog" role="dialog" aria-modal="true">
        <div class="dialog-head">
            <h2>Ir a un nivel</h2>
            <button id="close-jump" class="close-btn" type="button" aria-label="Cerrar">×</button>
        </div>
        <form id="jump-form" class="jump-form">
            <input id="jump-level" type="number" min="1" inputmode="numeric" placeholder="Número de nivel">
            <button type="submit">Ir</button>
        </form>
        <div id="jump-note" class="dialog-note"></div>
    </section>
</div>

<script src="js/player-progress.js"></script>
<script>
(() => {
    'use strict';

    const PAGE_SIZE = 20;
    const POSITIONS = ['center','left','right','center','left','right'];

    let progression = [];
    let maxLevel = 1;
    let maxUnlocked = 1;
    let currentLevel = 1;
    let page = 0;

    const progressApi = window.TampiDokuProgress;

    init();

    async function init() {
        try {
            const response = await fetch('data/progresion.json', { cache:'no-store' });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            progression = (await response.json())
                .filter(x => Number.isInteger(Number(x.nivel)))
                .sort((a,b) => Number(a.nivel)-Number(b.nivel));

            if (!progression.length) throw new Error('progresion.json vacío');

            maxLevel = Number(progression[progression.length - 1].nivel);
            maxUnlocked = Math.min(progressApi?.getMaxUnlockedLevel?.() || 1, maxLevel);
            currentLevel = Math.min(progressApi?.getCurrentLevel?.() || 1, maxUnlocked);

            page = Math.floor((currentLevel - 1) / PAGE_SIZE);

            renderSummary();
            renderPage();
            bindUi();
        } catch (error) {
            console.error('[TampiDoku niveles]', error);
            document.getElementById('levels').innerHTML =
                '<p style="text-align:center;color:#a33">No se pudo cargar la progresión.</p>';
        }
    }

    function renderSummary() {
        const completed = progressApi?.getCompletedCount?.() || 0;
        const stars = progressApi?.getTotalStars?.() || 0;
        const percent = maxLevel > 1
            ? ((maxUnlocked - 1) / (maxLevel - 1)) * 100
            : 100;

        document.getElementById('progress-info').textContent =
            `Máximo ${maxUnlocked} · ${stars} ⭐`;
        document.getElementById('completed-info').textContent =
            `${completed} completados`;
        document.getElementById('stars-info').textContent =
            `${stars} estrellas`;
        document.getElementById('progress-fill').style.width =
            `${Math.max(0, Math.min(100, percent))}%`;
    }

    function renderPage() {
        const start = page * PAGE_SIZE + 1;
        const end = Math.min(start + PAGE_SIZE - 1, maxLevel);

        document.getElementById('chapter-title').textContent =
            `Bloque ${page + 1}`;
        document.getElementById('chapter-range').textContent =
            `Niveles ${start}–${end}`;

        document.getElementById('prev-page').disabled = page <= 0;
        document.getElementById('next-page').disabled = end >= maxLevel;

        const host = document.getElementById('levels');
        host.replaceChildren();

        for (let level = start; level <= end; level++) {
            const row = document.createElement('div');
            row.className = `level-row ${POSITIONS[(level - 1) % POSITIONS.length]}`;

            const wrap = document.createElement('div');
            wrap.className = 'level-wrap';

            const stars = progressApi?.getStars?.(level) || 0;
            const starsEl = document.createElement('div');
            starsEl.className = 'stars';
            starsEl.innerHTML = renderStars(stars);

            const state = getState(level);
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = `level-node ${state}`;
            btn.dataset.level = level;
            btn.textContent = level;

            if (level === currentLevel) btn.id = 'current-level';

            if (state === 'locked') {
                btn.disabled = true;
                const lock = document.createElement('span');
                lock.className = 'lock';
                lock.textContent = '🔒';
                btn.appendChild(lock);
            } else {
                btn.addEventListener('click', () => openLevel(level));
            }

            const label = document.createElement('div');
            label.className = 'level-label';
            label.textContent =
                state === 'current' ? 'Último jugado' :
                state === 'completed' ? 'Completado' :
                state === 'available' ? 'Disponible' : 'Bloqueado';

            wrap.append(starsEl, btn, label);
            row.appendChild(wrap);
            host.appendChild(row);
        }

        requestAnimationFrame(buildRoute);
    }

    function getState(level) {
        if (level > maxUnlocked) return 'locked';
        if (level === currentLevel) return 'current';
        if (progressApi?.getLevelResult?.(level)?.completed) return 'completed';
        return 'available';
    }

    function renderStars(count) {
        if (!count) return '&nbsp;';
        let html = '';
        for (let i=1;i<=3;i++) {
            html += i <= count ? '⭐' : '<span class="off">⭐</span>';
        }
        return html;
    }

    function openLevel(level) {
        if (level > maxUnlocked) return;
        window.location.href = `index_niveles.html?nivel=${encodeURIComponent(level)}`;
    }

    function buildRoute() {
        const map = document.getElementById('level-map');
        const svg = map.querySelector('.route-svg');
        const nodes = [...map.querySelectorAll('.level-node')];
        if (!nodes.length) return;

        const mapRect = map.getBoundingClientRect();
        const points = nodes.map(node => {
            const r = node.getBoundingClientRect();
            return {
                x: r.left - mapRect.left + r.width/2,
                y: r.top - mapRect.top + r.height/2
            };
        });

        svg.setAttribute('viewBox', `0 0 ${mapRect.width} ${mapRect.height}`);

        let d = `M ${points[0].x} ${points[0].y}`;
        for (let i=1;i<points.length;i++) {
            const a = points[i-1];
            const b = points[i];
            const midY = (a.y+b.y)/2;
            d += ` C ${a.x} ${midY}, ${b.x} ${midY}, ${b.x} ${b.y}`;
        }
        svg.innerHTML = `<path class="route-path" d="${d}"></path>`;
    }

    function bindUi() {
        document.getElementById('go-home').addEventListener('click', () => window.location.href = 'index.html');
        document.getElementById('go-current').addEventListener('click', () => {
            page = Math.floor((currentLevel - 1) / PAGE_SIZE);
            renderPage();
            setTimeout(() => document.getElementById('current-level')?.scrollIntoView({
                behavior:'smooth', block:'center'
            }), 30);
        });

        document.getElementById('prev-page').addEventListener('click', () => {
            if (page > 0) { page--; renderPage(); window.scrollTo({top:0,behavior:'smooth'}); }
        });
        document.getElementById('next-page').addEventListener('click', () => {
            const lastPage = Math.floor((maxLevel - 1) / PAGE_SIZE);
            if (page < lastPage) { page++; renderPage(); window.scrollTo({top:0,behavior:'smooth'}); }
        });

        const selector = document.getElementById('selector');
        document.getElementById('open-jump').addEventListener('click', () => {
            selector.classList.add('open');
            selector.setAttribute('aria-hidden','false');
            document.getElementById('jump-level').focus();
        });
        document.getElementById('close-jump').addEventListener('click', closeJump);
        selector.addEventListener('click', e => { if (e.target === selector) closeJump(); });

        document.getElementById('jump-form').addEventListener('submit', e => {
            e.preventDefault();
            const level = Number(document.getElementById('jump-level').value);
            const note = document.getElementById('jump-note');

            if (!Number.isInteger(level) || level < 1 || level > maxLevel) {
                note.textContent = `Escribe un nivel entre 1 y ${maxLevel}.`;
                return;
            }
            if (level > maxUnlocked) {
                note.textContent = `El nivel ${level} está bloqueado. Has llegado hasta el ${maxUnlocked}.`;
                return;
            }
            openLevel(level);
        });

        window.addEventListener('resize', () => requestAnimationFrame(buildRoute));
    }

    function closeJump() {
        const selector = document.getElementById('selector');
        selector.classList.remove('open');
        selector.setAttribute('aria-hidden','true');
        document.getElementById('jump-note').textContent = '';
    }
})();
</script>
</body>
</html>
